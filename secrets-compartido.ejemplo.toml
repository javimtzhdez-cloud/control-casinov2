# Configuración opcional: pega en Streamlit Settings > Secrets.
# NO subas este archivo a GitHub después de poner contraseñas reales.
[app]
modo = "compartido"

# Supabase > Connect > Session pooler > View parameters.
# Copia cada campo tal cual. Aquí la contraseña NO necesita codificación URL.
[database]
host = "CAMBIA_POR_EL_HOST.pooler.supabase.com"
port = 5432
dbname = "postgres"
user = "postgres.CAMBIA_POR_TU_PROYECTO"
password = "CAMBIA_POR_TU_PASSWORD_DE_BASE"

[usuarios.hermano1]
nombre = "Hermano 1"
clave = "CAMBIA_POR_UNA_CLAVE_DE_12_O_MAS_CARACTERES"
[usuarios.hermano2]
nombre = "Hermano 2"
clave = "CAMBIA_POR_OTRA_CLAVE_DE_12_O_MAS_CARACTERES"
[usuarios.hermano3]
nombre = "Hermano 3"
clave = "CAMBIA_POR_UNA_TERCERA_CLAVE_DE_12_O_MAS_CARACTERES"
